<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pokédex • Catálogo Pokémon</title>
<style>
:root{font-family:Arial,Helvetica,sans-serif;color:#202b34;background:#e9edf0}*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px}.pokedex{width:min(950px,100%);background:#bf303a;border:8px solid #92212d;border-radius:28px;box-shadow:0 20px 45px #0003;padding:22px}.top{display:flex;align-items:center;gap:12px;margin-bottom:20px}.lens{height:58px;width:58px;border:5px solid #eafaff;border-radius:50%;background:radial-gradient(circle at 30% 25%,#d8ffff,#36b8e1 50%,#10638b);box-shadow:0 0 0 3px #75232c}.led{width:13px;height:13px;border-radius:50%;border:2px solid #552027;background:#e6ce2b}.led.green{background:#70e847}.brand{margin-left:auto;color:#ffe8e8;font-weight:bold;letter-spacing:3px}.screens{display:grid;grid-template-columns:1fr 1fr;gap:22px}.panel{min-width:0}.screen-frame{background:#e9e9e5;padding:16px;border-radius:10px 10px 10px 35px;box-shadow:inset 0 -5px #aeb4b6}.screen{height:280px;background:linear-gradient(160deg,#bce9f7,#f8fcff);border:6px solid #252c38;border-radius:8px;display:flex;flex-direction:column;align-items:center;justify-content:center;position:relative;overflow:hidden}.screen:after{content:"";position:absolute;inset:0;background:repeating-linear-gradient(transparent 0 5px,#00000006 6px);pointer-events:none}.screen img{width:210px;height:210px;object-fit:contain;image-rendering:auto;filter:drop-shadow(0 12px 7px #0002)}.number{position:absolute;top:12px;left:14px;font-weight:bold;color:#344b60}.pokemon-name{text-transform:capitalize;font-size:22px;font-weight:800;margin-top:-8px}.controls{display:flex;gap:10px;margin-top:16px}.controls button,.search button,.random{cursor:pointer;border:0;border-radius:9px;background:#25303c;color:white;padding:12px 16px;font-weight:bold}.controls button:hover,.search button:hover,.random:hover{background:#41586c}.controls button:disabled{opacity:.35;cursor:not-allowed}.controls button{flex:1}.status{margin:12px 0 0;background:#a9df79;padding:11px;border:3px solid #304c25;border-radius:8px;font-size:13px;min-height:42px}.info-screen{background:#1c2731;border:7px solid #25252a;border-radius:9px;color:#c5f5e2;padding:17px;min-height:238px}.info-screen h2{margin:0 0 10px;font-size:23px;text-transform:capitalize;color:white}.info-screen .subtitle{color:#88c8c5;font-size:12px;letter-spacing:2px}.types{display:flex;gap:7px;flex-wrap:wrap;margin:12px 0}.type{background:#547b89;color:white;padding:6px 10px;border-radius:16px;font-size:12px;font-weight:bold}.facts{display:grid;grid-template-columns:1fr 1fr;gap:10px;font-size:14px}.facts b{display:block;color:#8ebcb4;font-size:11px;text-transform:uppercase;margin-bottom:4px}.abilities{margin-top:13px;font-size:13px;line-height:1.5}.stats{margin-top:14px}.stat{display:grid;grid-template-columns:88px 1fr 27px;gap:8px;align-items:center;font-size:11px;margin:7px 0}.bar{background:#41505a;height:8px;border-radius:10px;overflow:hidden}.fill{height:100%;background:#76d9aa;border-radius:10px}.search{display:flex;gap:8px;margin-top:16px}.search input{min-width:0;flex:1;padding:13px;border:3px solid #9c222b;border-radius:9px;font-size:15px}.search button{background:#f0ca3c;color:#2c2924}.random{margin-top:10px;width:100%;background:#326e9b}.footer{margin-top:16px;text-align:center;font-size:12px;color:#ffe6e6}button:focus-visible,input:focus-visible{outline:3px solid #ffe24d;outline-offset:2px}@media(max-width:680px){body{padding:10px}.pokedex{padding:14px;border-width:5px}.screens{grid-template-columns:1fr}.screen{height:250px}.brand{font-size:12px}.info-screen{min-height:0}}
</style>
</head>
<body>
<main class="pokedex">
  <header class="top"><div class="lens" aria-hidden="true"></div><div class="led"></div><div class="led green"></div><div class="led"></div><div class="brand">POKÉDEX 01</div></header>
  <div class="screens">
    <section class="panel" aria-label="Imagem do Pokémon">
      <div class="screen-frame"><div class="screen"><span class="number" id="numero">#0025</span><img id="imagem" alt="Imagem do Pokémon" src=""/><div class="pokemon-name" id="nomeImagem">Pikachu</div></div></div>
      <div class="controls"><button id="anterior" type="button">◀ Anterior</button><button id="proximo" type="button">Próximo ▶</button></div>
      <p class="status" id="status" role="status" aria-live="polite">Iniciando Pokédex...</p>
    </section>
    <section class="panel" aria-label="Dados do Pokémon">
      <div class="info-screen"><div class="subtitle">REGISTRO POKÉMON</div><h2 id="nome">Carregando...</h2><div class="types" id="tipos"></div><div class="facts"><div><b>Altura</b><span id="altura">—</span></div><div><b>Peso</b><span id="peso">—</span></div></div><div class="abilities"><b>Habilidades:</b> <span id="habilidades">—</span></div><div class="stats" id="estatisticas"></div></div>
      <form class="search" id="formBusca"><input id="busca" type="search" placeholder="Nome ou número (ex.: ditto, 132)" aria-label="Nome ou número do Pokémon" required autocomplete="off"><button type="submit">Buscar</button></form>
      <button class="random" id="aleatorio" type="button">Surpreenda-me: Pokémon aleatório</button>
    </section>
  </div>
  <footer class="footer">Dados e imagens: PokéAPI • Requer conexão com a internet</footer>
</main>
<script>
const API = 'https://pokeapi.co/api/v2/pokemon/';
const $ = id => document.getElementById(id);
const nomesTipos = {normal:'Normal',fire:'Fogo',water:'Água',electric:'Elétrico',grass:'Planta',ice:'Gelo',fighting:'Lutador',poison:'Venenoso',ground:'Terra',flying:'Voador',psychic:'Psíquico',bug:'Inseto',rock:'Pedra',ghost:'Fantasma',dragon:'Dragão',dark:'Sombrio',steel:'Aço',fairy:'Fada'};
const cores = {normal:'#9299a1',fire:'#e97c3b',water:'#4285cf',electric:'#d4aa23',grass:'#48a76b',ice:'#58b6c6',fighting:'#b84a45',poison:'#9c5db1',ground:'#b18d4d',flying:'#728fc6',psychic:'#d56b93',bug:'#8aab37',rock:'#a58b5d',ghost:'#76639d',dragon:'#6961b8',dark:'#54515b',steel:'#718e9c',fairy:'#c97aab'};
const nomesStats = {hp:'HP',attack:'Ataque',defense:'Defesa','special-attack':'At. especial','special-defense':'Def. especial',speed:'Velocidade'};
let atual = 25;
let requisicao = 0;
const cache = new Map();
function status(msg){$('status').textContent=msg;}
async function carregar(termo){
  const busca = String(termo).trim().toLowerCase();
  if(!busca)return;
  const token = ++requisicao;
  status('Consultando PokéAPI...');
  $('anterior').disabled = $('proximo').disabled = true;
  try{
    let p = cache.get(busca);
    if(!p){
      const resposta = await fetch(API + encodeURIComponent(busca));
      if(!resposta.ok){if(resposta.status===404)throw new Error('Pokémon não encontrado. Verifique o nome em inglês ou o número.');throw new Error('Erro HTTP '+resposta.status);}
      p = await resposta.json();
      cache.set(busca,p);cache.set(String(p.id),p);
    }
    if(token!==requisicao)return;
    atual=p.id;
    $('numero').textContent='#'+String(p.id).padStart(4,'0');
    $('nomeImagem').textContent=p.name.replaceAll('-',' ');
    $('nome').textContent=p.name.replaceAll('-',' ');
    const foto=p.sprites?.other?.['official-artwork']?.front_default || p.sprites?.front_default || '';
    $('imagem').src=foto;
    $('imagem').alt='Imagem de '+p.name;
    $('tipos').replaceChildren();
    p.types.forEach(t=>{const tag=document.createElement('span');tag.className='type';tag.textContent=nomesTipos[t.type.name]||t.type.name;tag.style.background=cores[t.type.name]||'#547b89';$('tipos').append(tag);});
    $('altura').textContent=(p.height/10).toLocaleString('pt-BR')+' m';
    $('peso').textContent=(p.weight/10).toLocaleString('pt-BR')+' kg';
    $('habilidades').textContent=p.abilities.map(a=>a.ability.name.replaceAll('-',' ')+(a.is_hidden?' (oculta)':'')).join(', ');
    $('estatisticas').replaceChildren();
    p.stats.forEach(s=>{const linha=document.createElement('div');linha.className='stat';const rotulo=document.createElement('span');rotulo.textContent=nomesStats[s.stat.name]||s.stat.name;const barra=document.createElement('div');barra.className='bar';const fill=document.createElement('div');fill.className='fill';fill.style.width=Math.min(s.base_stat/255*100,100)+'%';barra.append(fill);const valor=document.createElement('strong');valor.textContent=s.base_stat;linha.append(rotulo,barra,valor);$('estatisticas').append(linha);});
    $('busca').value='';
    status('Registro #'+p.id+' encontrado com sucesso.');
  }catch(erro){if(token===requisicao){status(erro instanceof TypeError?'Falha de conexão. Verifique sua internet.':erro.message);}}
  finally{if(token===requisicao){$('anterior').disabled=atual<=1;$('proximo').disabled=false;}}
}
$('formBusca').addEventListener('submit',e=>{e.preventDefault();carregar($('busca').value);});
$('anterior').addEventListener('click',()=>carregar(Math.max(1,atual-1)));
$('proximo').addEventListener('click',()=>carregar(atual+1));
$('aleatorio').addEventListener('click',()=>carregar(Math.floor(Math.random()*1025)+1));
carregar(25);
</script>
</body>
</html>
